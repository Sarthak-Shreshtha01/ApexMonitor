name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:migrations
      - run: npm run lint
      - run: npm run typecheck --workspace=apps/server
      - run: npm run build --workspace=apps/server
      - name: Server bundle has no unresolved path aliases (KI-13)
        run: |
          if grep -nE 'require\("@(modules|shared|infrastructure|workers|events|config)' apps/server/dist/bootstrap.js; then exit 1; fi
      - run: npm run build --workspace=apps/web
      - run: npm run build:sdks
      - run: npm run conformance:sdks

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: npm ci
      # Server, web, TypeScript SDK, browser SDK (vitest) + Python SDK (unittest). No services needed.
      - run: npm test
      - name: Server unit-test coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: apps/server/coverage
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    # Host ports match docker-compose.yml so the test defaults work unchanged.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apexmonitor
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_dev_password
        ports: ['9999:5432']
        options: >-
          --health-cmd "pg_isready -U pulse -d apexmonitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pulse
          RABBITMQ_DEFAULT_PASS: pulse_dev
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Creates isolated test databases / vhost, applies migrations, boots the API + workers in-process.
      - run: npm run test:integration

  browser-tests:
    runs-on: ubuntu-latest
    # Same services as integration-tests; the API uses its own apexmonitor_e2e stores.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apexmonitor
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse_dev_password
        ports: ['9999:5432']
        options: >-
          --health-cmd "pg_isready -U pulse -d apexmonitor"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pulse
          RABBITMQ_DEFAULT_PASS: pulse_dev
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Starts the API (tsx) and a production build of the dashboard, then drives Chromium.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built from the repo root so the workspace lockfile is used (KI-22). Not pushed.
      - run: docker build -f apps/server/Dockerfile -t apexmonitor-server:ci .
      - run: docker build -f apps/web/Dockerfile -t apexmonitor-web:ci .
      - name: Production compose file is valid
        run: |
          cp infra/compose/.env.example infra/compose/.env
          sed -i -E 's/^(JWT_SECRET|JWT_REFRESH_SECRET|ARGON2_PEPPER|POSTGRES_PASSWORD|MONGO_PASSWORD|REDIS_PASSWORD|RABBITMQ_PASSWORD)=$/\1=ci-placeholder-value-0123456789abcdef/' infra/compose/.env
          docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/compose/.env config --quiet
