name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: SDK release version to publish
        required: true
        type: string

jobs:
  release-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run validate:migrations
      - run: npm run check:release-version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - run: npm run build:sdk
      - run: npm run build:browser-sdk
      - run: npm publish --workspace=@apexmonitor/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace=@apexmonitor/browser-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip build twine
      - run: npm ci
      - run: npm run check:release-version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
      - run: python -m build
        working-directory: packages/python-sdk
      - run: python -m twine upload dist/*
        working-directory: packages/python-sdk
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
