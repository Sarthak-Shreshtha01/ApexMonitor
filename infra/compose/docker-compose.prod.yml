# Production-style stack: databases + broker + migrations + API + dashboard.
#
#   cp infra/compose/.env.example infra/compose/.env   # fill in every secret
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file infra/compose/.env up -d --build
#
# Only the API (3000) and the dashboard (3001) are published; put a TLS-terminating
# reverse proxy in front of both. Databases and the broker are reachable only inside the
# compose network. See docs/operations/deployment.md.
name: apexmonitor

x-server-image: &server-image
  image: ${SERVER_IMAGE:-apexmonitor-server:latest}
  build:
    context: ../..
    dockerfile: apps/server/Dockerfile

x-server-env: &server-env
  NODE_ENV: production
  PORT: "3000"
  PG_URI: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-apexmonitor}
  MONGO_URI: mongodb://${MONGO_USER:?}:${MONGO_PASSWORD:?}@mongo:27017/apexmonitor?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
  JWT_SECRET: ${JWT_SECRET:?}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
  ARGON2_PEPPER: ${ARGON2_PEPPER:?}
  CORS_ORIGINS: ${CORS_ORIGINS:?}
  API_BASE_URL: ${API_BASE_URL:?}
  FRONTEND_URL: ${FRONTEND_URL:?}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apexmonitor}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # noeviction: rate-limit, idempotency and key-revocation entries must never be evicted.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    # management plugin kept for the dead-letter runbook; its port is not published
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # One-shot: applies pending database migrations, then exits. The API waits for it.
  migrate:
    <<: *server-image
    command: ["node", "dist/migrate.js"]
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server-image
    environment: *server-env
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    stop_grace_period: 30s # longer than SHUTDOWN_TIMEOUT_MS (25 s) so the drain can finish
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-apexmonitor-web:latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:?}
        NEXT_PUBLIC_WS_URL: ${API_BASE_URL:?}
    ports: ["${WEB_PORT:-3001}:3001"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
